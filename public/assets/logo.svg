<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-labelledby="title desc">
  <title id="title">Mundo dos Blocos</title>
  <desc id="desc">Logotipo original compacto com picareta cruzada sobre um livro aberto e palavras em letras grossas empilhadas.</desc>
  <!-- símbolo integrado: picareta atrás do livro -->
  <g stroke="#2B2118" stroke-width="3" stroke-linejoin="bevel" stroke-linecap="square">
    <path d="m18 16 8-6 61 83-9 7z" fill="#8B5E3C"/>
    <path d="M8 29C28 7 61 4 91 19l-5 13C59 19 34 20 17 41z" fill="#9AA0A6"/>
    <path d="m8 29 9 12-5 8L3 38z" fill="#6B7075"/>
    <path d="m91 19-5 13 9 5 5-12z" fill="#6B7075"/>
    <!-- livro aberto -->
    <path d="m7 69 40-14 14 9-40 15z" fill="#FDF6E8"/>
    <path d="m21 79 40-15v34l-40 16z" fill="#9AA0A6"/>
    <path d="M7 69l14 10v35L7 103z" fill="#6B7075"/>
    <path d="m61 64 38 14-14 10-38-15z" fill="#FDF6E8"/>
    <path d="M47 73l38 15v26L47 99z" fill="#8B5E3C"/>
    <path d="m85 88 14-10v25l-14 11z" fill="#5F3F27"/>
    <path d="m21 79 26-6v26l14-7 24 8" fill="none" stroke-width="2"/>
  </g>

  <!-- composição fechada em duas linhas -->
  <g font-family="Arial Black, DejaVu Sans, sans-serif" font-weight="900" letter-spacing="-.5" stroke="#2B2118" stroke-linejoin="bevel">
    <text x="116" y="53" font-size="43" textLength="352" lengthAdjust="spacingAndGlyphs" fill="#3E7A2B" stroke-width="8">MUNDO DOS</text>
    <text x="112" y="49" font-size="43" textLength="352" lengthAdjust="spacingAndGlyphs" fill="#5BA83F" stroke-width="3">MUNDO DOS</text>
    <text x="116" y="108" font-size="53" textLength="352" lengthAdjust="spacingAndGlyphs" fill="#8B5E3C" stroke-width="8">BLOCOS</text>
    <text x="112" y="104" font-size="53" textLength="352" lengthAdjust="spacingAndGlyphs" fill="#F2A93B" stroke-width="3">BLOCOS</text>
  </g>
</svg>
